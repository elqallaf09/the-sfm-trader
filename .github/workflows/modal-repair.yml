name: Materialize tested modal focus repair
on:
  push:
    branches: [fix/modal-focus-race]
    paths: [.github/workflows/modal-repair.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/modal-focus-race
          fetch-depth: 0
      - name: Verify exact tested source and apply patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          manifest = json.loads((root / '.modal-repair.json').read_text())
          files = manifest['files']
          assert len(files) == 7
          for name, checks in files.items():
              path = root / name
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('public/', 'tests/', 'tools/'))
              actual = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert actual == checks['before'], 'Changed preimage: ' + name
          encoded = ''.join((root / f'.modal-patch-{i}.b64').read_text().strip() for i in range(3))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == manifest['sha256'], 'Transport checksum mismatch'
          patch = gzip.decompress(compressed)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, checks in files.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == checks['after'], 'Output differs: ' + name
              print('Verified tested bytes:', name)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == set(files)
          subprocess.run(['git', 'commit', '-m', 'fix: remove modal focus timer race and preserve original focus'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/modal-focus-race'], check=True)
          PY
