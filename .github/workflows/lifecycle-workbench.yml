name: Lifecycle audit workbench
on:
  push:
    branches: [fix/lifecycle-observation-integrity]
    paths: [.github/workflows/lifecycle-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8003c00c6314000dc0253545a7787afb163104e
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/lifecycle-source
          git archive --format=tar.gz -o /tmp/lifecycle-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/lifecycle-source/revision.txt
          git ls-tree -r HEAD > /tmp/lifecycle-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-pinned-source
          path: /tmp/lifecycle-source/
          retention-days: 1
          if-no-files-found: error
