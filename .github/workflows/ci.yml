name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sfm
          POSTGRES_PASSWORD: sfm-ci-password
          POSTGRES_DB: sfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfm -d sfm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://sfm:sfm-ci-password@127.0.0.1:5432/sfm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run audit:css
      - run: npm audit --audit-level=high
      - name: Build production container
        run: docker build --tag the-sfm-trader:${{ github.sha }} .
