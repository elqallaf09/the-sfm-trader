name: Signal session repair workbench
on:
  push:
    branches: [fix/signal-card-evidence-20260916]
    paths: [.github/workflows/signal-card-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/signal-card-evidence-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify source and apply reviewed patch
        shell: python
        run: |
          import pathlib, hashlib, gzip, base64, subprocess
          source = pathlib.Path('src/analysis.mjs')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '654e6eae70c07ddf73c69aedcf62635b873a589b6540450cda216014d18670ff'
          assert not pathlib.Path('src/yahooSessionQuote.mjs').exists()
          assert not pathlib.Path('tests/yahooSessionQuote.test.mjs').exists()
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'f22dcb1dc221f48a04da03da4a51495a214bc8f50b860d9bc70f954f0e125101'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'], input=patch, check=True)
      - run: npm ci
      - run: npm test
      - name: Publish only reviewed source and tests to the repair branch
        run: |
          git diff --check
          node --check src/analysis.mjs
          git add src/analysis.mjs src/yahooSessionQuote.mjs tests/yahooSessionQuote.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(data): use previous daily session and preserve observed volume'
          git push origin HEAD:refs/heads/fix/signal-card-evidence-20260916
          git rev-parse HEAD
