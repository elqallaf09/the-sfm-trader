name: Mobile drawer acceptance
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-drawer-acceptance.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfm_test
          POSTGRES_PASSWORD: sfm_test_only
          POSTGRES_DB: sfm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sfm_test -d sfm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sfm_test:sfm_test_only@127.0.0.1:5432/sfm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct stylesheet layering and mobile scroll clearance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          mobile = '    <link rel="stylesheet" href="/symbol-detail-mobile.css?v=20260916-symbol-data" />\n'
          assert s.count(mobile) == 1
          s = s.replace(mobile, '')
          s = s.replace('    <link rel="stylesheet" href="/dashboard-v2.css', mobile + '    <link rel="stylesheet" href="/dashboard-v2.css', 1)
          p.write_text(s)
          p = Path('tests/layoutStability.test.mjs')
          s = p.read_text()
          assert 'the-sfm-trader-v20260914-async-selection-2' in s
          p.write_text(s.replace('the-sfm-trader-v20260914-async-selection-2', 'the-sfm-trader-v20260916-symbol-data'))
          p = Path('public/symbol-detail-mobile.css')
          p.write_text(p.read_text() + '''
          /* Leave focus/scroll targets above the fixed mobile navigation. */
          @media (max-width: 760px) {
            html { scroll-padding-block-end: calc(96px + env(safe-area-inset-bottom)); }
            .recommendation-detail-button { scroll-margin-block: 96px; }
          }
          @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto !important; }
            .recommendation-detail-drawer, .recommendation-detail-drawer * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
          }
          ''')
          PY
          npm ci
          npm run check
          node --test tests/layoutStability.test.mjs tests/symbolDetailData.test.mjs
          git diff --check
          git rm .github/workflows/mobile-drawer-acceptance.yml
          git add public/index.html public/symbol-detail-mobile.css tests/layoutStability.test.mjs
          git -c user.name='SFM repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(trader): preserve Home style priority and mobile focus scroll clearance'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - name: All unit and integration checks with Postgres
        run: |
          mkdir -p .artifacts
          npm run verify > .artifacts/verify.log 2>&1 || { tail -100 .artifacts/verify.log; exit 1; }
          tail -15 .artifacts/verify.log
      - name: Install browsers
        if: success() || failure()
        run: npx playwright install --with-deps chromium webkit > .artifacts/browser-install.log 2>&1
      - name: Chromium mobile acceptance
        if: success() || failure()
        run: node tools/capture-mobile-symbols.mjs
      - name: WebKit mobile acceptance
        if: success() || failure()
        env:
          MOBILE_TEST_BROWSER: webkit
        run: node tools/capture-mobile-symbols.mjs
      - name: Record exact tested commit and audit
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/trader-tested.tar.gz
          npm audit --json > .artifacts/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-drawer-acceptance
          path: .artifacts/
          include-hidden-files: true
          retention-days: 3
