name: Materialize verified Issue40 repair
on:
  push:
    branches: [fix/issue40-postmerge-regressions]
    paths: [.github/workflows/issue40-repair.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged source baseline
        run: git diff --exit-code 3e7d206395fe19df439ef278f577342706198848 HEAD -- public src server.mjs tests tools package.json package-lock.json
      - name: Apply preimage and output verified edits
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, subprocess
          encoded = ''.join(Path(f'.audit/issue40.part{i}').read_text().strip() for i in (1, 2, 3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '4044125bf8f8be22cd9068ebd82e957e1f287c65981454f0fe7a9f08486f16c2', 'Transport checksum mismatch'
          operations = json.loads(raw)
          assert len(operations) == 20
          for name, spec in operations.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name == 'server.mjs' or path.parts[0] in ('public', 'src', 'tests', 'tools')
              target = Path(name)
              before = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(before).hexdigest() == spec['before'], f'Preimage mismatch: {name}'
              text = before.decode('utf-8')
              previous_end = 0
              for start, end, replacement in spec['edits']:
                  assert previous_end <= start <= end <= len(text)
                  previous_end = end
              for start, end, replacement in reversed(spec['edits']):
                  text = text[:start] + replacement + text[end:]
              after = text.encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == spec['after'], f'Output mismatch: {name}'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(after)
              print(f'verified {name} {spec["after"]}')
          subprocess.run(['git', 'add', '--', *operations.keys()], check=True)
          PY
      - name: Commit and push only the repair branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce execution guards and truthful accounting across Issue40 paths'
          git push origin HEAD:refs/heads/fix/issue40-postmerge-regressions
