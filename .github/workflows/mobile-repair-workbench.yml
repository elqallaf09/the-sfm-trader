name: Mobile repair workbench
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-repair-workbench.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed scoped repair
        run: |
          python .repair/apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/marketDataProvenance.mjs')
          p.write_text(p.read_text().replace('finite(meta.chartPreviousClose ?? meta.previousClose)', 'finite(meta.previousClose)'))
          PY
          npm run check
          node --test tests/symbolDetailData.test.mjs
          git diff --check
          git rm -r .repair
          git rm .github/workflows/mobile-repair-workbench.yml
          git add public src tests tools
          git -c user.name='SFM repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(trader): repair mobile symbol data fetching and evidence presentation'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - run: npm ci
      - name: Full existing verification
        run: npm run verify
      - name: Install both browsers
        if: success() || failure()
        run: npx playwright install --with-deps chromium webkit
      - name: Home and drawer Chromium journeys
        if: success() || failure()
        run: |
          node tools/capture-home-v3.mjs
          node tools/capture-deep-audit.mjs
      - name: Mobile WebKit journeys
        if: success() || failure()
        env:
          MOBILE_TEST_BROWSER: webkit
        run: |
          node tools/capture-home-v3.mjs
          node tools/capture-deep-audit.mjs
      - name: Archive exact tested source
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/trader-tested.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-repair-verification
          path: .artifacts/
          include-hidden-files: true
          retention-days: 3
