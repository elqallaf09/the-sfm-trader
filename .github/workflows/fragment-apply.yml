name: Materialize tested fragment dismissal
on:
  push:
    branches: [fix/modal-focus-race]
    paths: [.github/workflows/fragment-apply.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/modal-focus-race
          fetch-depth: 0
      - name: Apply exact tested source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .fragment-apply.py
