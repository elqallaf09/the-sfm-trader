name: Apply verified audit repair
on:
  push:
    branches: [fix/deep-integrity-interactions-audit]
    paths: [.github/workflows/deep-audit-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate and apply reviewed source deltas
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          updated=[]
          for manifest in sorted(root.glob('.audit/*-deltas*.json')):
            for item in json.loads(manifest.read_text()):
              p=root/item['path']
              assert p.resolve().is_relative_to(root) and '.git' not in p.parts
              if item['path'].startswith('.github/'):
                continue
              old=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(old).hexdigest()==item['before'], 'Base mismatch '+item['path']
              lines=old.decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):
                assert 0<=start<=end<=len(lines)
                lines[start:end]=[text]
              new=''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest()==item['after'], 'Output mismatch '+item['path']
              updated.append((p,new))
          assert len(updated)==30, len(updated)
          for p,data in updated:
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(data)
          subprocess.run(['git','add','--',*[str(p.relative_to(root)) for p,_ in updated]],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run check && npm test && npm run test:integration
      - name: Commit tested repairs to the audit branch only
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close data-integrity bypasses and repair mobile navigation and settings'
          git push origin HEAD:refs/heads/fix/deep-integrity-interactions-audit
