name: Deep audit workbench
on:
  push:
    branches: [fix/deep-integrity-interactions-audit]
    paths: [.github/workflows/deep-audit-workbench.yml]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package tracked source and test dependencies only
        run: |
          mkdir -p audit-bundle
          git archive --format=tar.gz --output=audit-bundle/source.tar.gz HEAD
          tar -czf audit-bundle/dependencies.tar.gz node_modules
          git rev-parse HEAD > audit-bundle/revision.txt
          mkdir -p /tmp/sfm-audit-browser
          npm install --prefix /tmp/sfm-audit-browser --no-audit --no-fund agent-browser
          tar -czf audit-bundle/browser-tool.tar.gz -C /tmp/sfm-audit-browser node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-audit-workbench
          path: audit-bundle/
          retention-days: 1
