name: Mobile repair final verification
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-repair-final.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bound explicit user-requested refresh and record test diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8-sig')
          old = 'fetchJsonWithPolicy(`/api/asset?symbol=${encodeURIComponent(symbol)}`, { signal, timeoutMs: 20000, retries: 1 })'
          assert s.count(old) == 1
          s = s.replace(old, 'fetchJsonWithPolicy(`/api/asset?symbol=${encodeURIComponent(symbol)}`, { signal, timeoutMs: 12000, retries: 0 })')
          p.write_text('\ufeff'+s)
          p = Path('tools/mobile-symbol-regression.mjs')
          s = p.read_text().replace("const errors = []; page.on('pageerror'", "const errors = []; const network = []; page.on('requestfailed', request => network.push({ url: request.url(), failure: request.failure() })); page.on('response', response => { if (response.url().includes('/api/asset')) network.push({ url: response.url(), status: response.status() }); }); page.on('pageerror'")
          s = s.replace('JSON.stringify({ error: error.message, errors, setup }, null, 2)', 'JSON.stringify({ error: error.message, stack: error.stack, errors, network, assetCalls, setup, drawer: await page.locator("[data-recommendation-drawer]").innerText().catch(() => "closed") }, null, 2)')
          p.write_text(s)
          PY
          npm ci
          npm update @xmldom/xmldom nanoid
          npm audit --audit-level=high
          git diff --check
          git rm .github/workflows/mobile-repair-final.yml
          git add public/app.js tools/mobile-symbol-regression.mjs package-lock.json
          git -c user.name='SFM repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(trader): cap interactive refresh latency and update vulnerable dev dependencies'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - run: npm run verify
      - name: Install browsers
        if: success() || failure()
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium drawer and home
        if: success() || failure()
        run: |
          node tools/capture-deep-audit.mjs
          node tools/capture-home-v3.mjs
      - name: WebKit drawer and home
        if: success() || failure()
        env:
          MOBILE_TEST_BROWSER: webkit
        run: |
          node tools/capture-deep-audit.mjs
          node tools/capture-home-v3.mjs
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/trader-tested.tar.gz
          npm audit --json > .artifacts/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-repair-final-verification
          path: .artifacts/
          include-hidden-files: true
          retention-days: 3
