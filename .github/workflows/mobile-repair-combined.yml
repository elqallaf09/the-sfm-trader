name: Verify combined mobile repair
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-repair-combined.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfm_test
          POSTGRES_PASSWORD: sfm_test_only
          POSTGRES_DB: sfm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sfm_test -d sfm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sfm_test:sfm_test_only@127.0.0.1:5432/sfm_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile concurrent source
        run: |
          mkdir -p .artifacts
          git config user.name 'SFM repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 70828beb2092804abde214c9e65ae7121bc0cde8 > .artifacts/merge.log 2>&1 || true
          python .repair/resolve-concurrent.py
          python - <<'PY'
          from pathlib import Path
          p = Path('public/analysis-metrics.css')
          p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines()) + '\n')
          p = Path('tools/mobile-symbol-regression.mjs')
          lines = p.read_text().splitlines()
          # Network state waits must not depend on WebKit's animation-frame scheduling.
          # Predicates, timeout, assertions and request expectations remain unchanged.
          for i, line in enumerate(lines):
            if 'await page.waitForFunction(' in line and line.rstrip().endswith(');'):
              lines[i] = line.rstrip()[:-2] + ', undefined, { polling: 100 });'
          s = '\n'.join(lines) + '\n'
          s = s.replace('errors, network, assetCalls, setup, drawer:', 'errors, network, assetCalls, setup, dom: await page.locator("#recommendation-detail-content").evaluateAll(elements => elements.map(element => ({ text: element.textContent, busy: element.getAttribute("aria-busy"), connected: element.isConnected }))), drawer:')
          p.write_text(s)
          PY
          npm install --save-dev --save-exact playwright@1.63.0 > .artifacts/install.log 2>&1
          npm update @xmldom/xmldom nanoid >> .artifacts/install.log 2>&1
          npm run check
          git rm -r .repair
          git rm .github/workflows/mobile-repair-sync.yml .github/workflows/mobile-repair-combined.yml
          git add public src tools tests package.json package-lock.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'fix(trader): reconcile mobile symbol repair with concurrent integrity and UI improvements'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - name: Complete verification including isolated Postgres
        run: |
          npm run verify > .artifacts/verify.log 2>&1 || { tail -120 .artifacts/verify.log; exit 1; }
          tail -20 .artifacts/verify.log
      - name: Security audit
        if: success() || failure()
        run: npm audit --audit-level=high
      - name: Install browsers
        if: success() || failure()
        run: npx playwright install --with-deps chromium webkit > .artifacts/browsers-install.log 2>&1
      - name: New mobile Chromium journeys
        if: success() || failure()
        run: node tools/capture-mobile-symbols.mjs
      - name: New mobile WebKit journeys
        if: success() || failure()
        env:
          MOBILE_TEST_BROWSER: webkit
        run: node tools/capture-mobile-symbols.mjs
      - name: Existing browser audit suites
        if: success() || failure()
        run: |
          PORT=4173 node server.mjs > /tmp/mobile-repair-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tools/capture-home-v3.mjs > .artifacts/home-audit.log 2>&1
          node tools/capture-deep-audit.mjs > .artifacts/deep-audit.log 2>&1
      - name: Archive tested source
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/trader-tested.tar.gz
          git diff > .artifacts/source/uncommitted.diff
          npm audit --json > .artifacts/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-mobile-repair-verification
          path: .artifacts/
          include-hidden-files: true
          retention-days: 3
