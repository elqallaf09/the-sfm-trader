name: Materialize tested lifecycle repair
on:
  push:
    branches: [fix/lifecycle-observation-integrity]
    paths: [.github/workflows/lifecycle-apply.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lifecycle-observation-integrity
          fetch-depth: 0
      - name: Verify and commit exact tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .lifecycle-transport/apply.py
